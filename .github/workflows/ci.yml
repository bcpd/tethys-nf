name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validation:
    runs-on: ubuntu-latest
    env:
      NXF_VER: '26.04.4'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Nextflow
        run: |
          curl -fsSL https://get.nextflow.io -o install-nextflow.sh
          bash install-nextflow.sh
          sudo mv nextflow /usr/local/bin/nextflow
          nextflow -version

      - name: Install merge test dependencies
        run: |
          python -m pip install \
            'numpy>=1.26,<1.27' 'pandas>=2.1,<2.2' 'pyarrow>=14,<15' \
            'xarray>=2023.9,<2024.1' 'h5netcdf>=1.2,<1.3' 'tqdm>=4.66,<4.67' \
            'pyexeggutor==2025.2.19' 'kegg-pathway-profiler==2024.10.16'

      - name: Run unit and workflow tests
        run: python -m unittest discover -s tests -v
